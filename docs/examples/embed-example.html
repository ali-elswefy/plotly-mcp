<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedding a PlotlyTools dashboard</title>
<style>
  body { margin: 0; font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #ffffff; color: #1f2937; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #4b5563; }
  code { background: #f3f4f6; padding: 1px 4px; border-radius: 4px; }
  /* The dashboard page is responsive: it fills the frame's width and scrolls inside it. */
  .dashboard-frame { display: block; width: 100%; height: 900px; border: 1px solid #e5e7eb; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>Embedding a PlotlyTools dashboard</h1>
  <p>
    The dashboard below is <code>mock-dashboard.html</code>, exactly as <code>create_dashboard</code> returned it,
    placed in an <code>&lt;iframe&gt;</code>. It needs no other files; plotly.js loads from the CDN.
  </p>
  <iframe class="dashboard-frame" src="mock-dashboard.html" title="Northwind Outdoor sales and operations dashboard" loading="lazy"></iframe>
</main>
</body>
</html>
